name: CI/CD

on:
  push:
    branches: [ "terraform" ]
  pull_request:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ${{secrets.REGISTRY}}
  IMAGE_NAME: ${{secrets.IMAGE_NAME}}

jobs:
  build-test-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm
      
      - name: Validate registry/image name
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${IMAGE_NAME}" != "${REGISTRY}/"* ]]; then
            echo "ERROR: IMAGE_NAME must start with ${REGISTRY}/"
            exit 1
          fi
        
      - name: Install deps
        run: npm ci

      - name: Unit tests
        run: npm test

      - name: Lint
        run: npm run lint

      - name: Log in to container registry
        uses: docker/login-action@v3
        with:
          registry: ${{env.REGISTRY}}
          username: ${{secrets.REGISTRY_USERNAME}}
          password: ${{secrets.REGISTRY_TOKEN}}
    
      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}

      - name: Build & push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{steps.meta.outputs.tags}}
          labels: ${{steps.meta.outputs.labels}}

  deploy:
    needs: build-test-lint
    if: github.ref == 'refs/heads/terraform'
    runs-on: ubuntu-latest
    steps:
      - name: SSH into VM and deploy container
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{secrets.VM_HOST_TF}}
          username: ${{secrets.VM_USER}}
          key: ${{secrets.SSH_PRIVATE_KEY}}
          script: |
            set -euxo pipefail
            # Ensure Docker is present
            if ! command -v docker >/dev/null; then
              curl -fsSL https://get.docker.com | sh
              sudo systemctl enable --now docker || true
            fi

            # Log in & pull latest image
            docker login ${{env.REGISTRY}} -u '${{secrets.REGISTRY_USERNAME}}' -p '${{secrets.REGISTRY_TOKEN}}'
            docker pull ${{env.IMAGE_NAME}}:latest

            # Stop old container if present
            docker rm -f node-hello || true

            # Run new container bound to localhost:3000 (nginx proxies :80 -> :3000)
            docker run -d --name node-hello \
              -e PORT=3000 \
              -p 127.0.0.1:3000:3000 \
              ${{env.IMAGE_NAME}}:latest

            # Health check with retry (up to ~30s)
            for i in $(seq 1 15); do
            if curl -fsS http://127.0.0.1:3000/ >/dev/null; then
                echo "App is healthy"
                break
            fi
            echo "Waiting for app to be ready ($i/15)..."
            sleep 2
            done

            # If still not healthy, show logs and fail
            if ! curl -fsS http://127.0.0.1:3000/ >/dev/null; then
            echo "App failed. Recent logs:"
            docker logs --tail=200 node-hello || true
            exit 1
            fi
            
            sudo nginx -t && sudo systemctl reload nginx