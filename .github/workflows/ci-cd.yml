name: CI/CD

on:
  push:
    branches: [ "marcusdev" ]
  pull_request:

env:
  REGISTRY: ${{secrets.REGISTRY}}
  IMAGE_NAME: ${{secrets.IMAGE_NAME}}

jobs:
  build-test-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install deps
        run: npm ci

      - name: Unit tests
        run: npm test

      - name: Lint
        run: npm run lint

      - name: Log in to container registry
        uses: docker/login-action@v3
        with:
          registry: ${{env.REGISTRY}}
          username: ${{secrets.REGISTRY_USERNAME}}
          password: ${{secrets.REGISTRY_TOKEN}}

      - name: Build & push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE_NAME }}:latest

  deploy:
    needs: build-test-lint
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: SSH into VM and deploy container
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{secrets.VM_HOST}}
          username: ${{secrets.VM_USER}}
          key: ${{secrets.SSH_PRIVATE_KEY}}
          script: |
            set -euxo pipefail
            # Ensure Docker is present
            if ! command -v docker >/dev/null; then
              curl -fsSL https://get.docker.com | sh
              sudo systemctl enable --now docker || true
            fi

            # Log in & pull latest image
            docker login ${{env.REGISTRY}} -u '${{secrets.REGISTRY_USERNAME}}' -p '${{secrets.REGISTRY_TOKEN}}'
            docker pull ${{env.IMAGE_NAME}}:latest

            # Stop old container if present
            docker rm -f node-hello || true

            # Run new container bound to localhost:3000 (nginx proxies :80 -> :3000)
            docker run -d --name node-hello \
              -e PORT=3000 \
              -p 127.0.0.1:3000:3000 \
              ${{env.IMAGE_NAME}}:latest

            # Health check & reload nginx
            curl -sf http://127.0.0.1:3000/ >/dev/null
            sudo nginx -t && sudo systemctl reload nginx
